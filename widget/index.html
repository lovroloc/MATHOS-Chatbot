<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathos asistent</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0; background: #f4f5f7; display: flex;
    justify-content: center; align-items: center; min-height: 100vh;
  }
  .chat {
    width: 100%; max-width: 520px; height: 90vh; max-height: 700px;
    background: #fff; border-radius: 12px; display: flex; flex-direction: column;
    box-shadow: 0 2px 16px rgba(0,0,0,.08); overflow: hidden;
  }
  .header {
    background: #0d3b66; color: #fff; padding: 14px 18px; font-weight: 600;
  }
  .header small { display: block; font-weight: 400; opacity: .8; font-size: 12px; }
  .messages { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { margin-bottom: 14px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 85%; padding: 10px 14px; border-radius: 12px;
    line-height: 1.45; white-space: pre-wrap; font-size: 14px;
  }
  .user .bubble { background: #0d3b66; color: #fff; border-bottom-right-radius: 3px; }
  .bot .bubble { background: #eef0f3; color: #1a1a1a; border-bottom-left-radius: 3px; }
  .sources { margin-top: 8px; font-size: 12px; }
  .sources a { display: block; color: #0d3b66; margin-top: 3px; }
  .input-row { display: flex; border-top: 1px solid #e3e5e8; padding: 10px; gap: 8px; }
  input {
    flex: 1; padding: 10px 12px; border: 1px solid #d0d3d8;
    border-radius: 8px; font-size: 14px; outline: none;
  }
  input:focus { border-color: #0d3b66; }
  button {
    padding: 10px 18px; background: #0d3b66; color: #fff; border: none;
    border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  button:disabled { opacity: .5; cursor: default; }
  .suggestions { padding: 0 16px 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .suggestions button {
    background: #eef0f3; color: #0d3b66; font-size: 12px; padding: 6px 10px;
  }
  .typing { color: #888; font-style: italic; font-size: 13px; }
</style>
</head>
<body>
<div class="chat">
  <div class="header">
    Mathos asistent
    <small>Odgovara na pitanja o fakultetu</small>
  </div>

  <div class="messages" id="messages"></div>

  <div class="suggestions" id="suggestions">
    <button onclick="ask('Kad je referada otvorena?')">Radno vrijeme referade</button>
    <button onclick="ask('Koji je mail od dekana?')">Kontakt dekana</button>
    <button onclick="ask('Koliko ECTS-a nosi Diferencijalni račun?')">ECTS kolegija</button>
  </div>

  <div class="input-row">
    <input id="input" placeholder="Postavite pitanje..." onkeydown="if(event.key==='Enter') send()">
    <button id="sendBtn" onclick="send()">Pošalji</button>
  </div>
</div>

<script>
const API = "http://localhost:8000";
let sessionId = null;

const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");

function addMessage(text, who, sources) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + who;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  if (sources && sources.length) {
    const s = document.createElement("div");
    s.className = "sources";
    s.innerHTML = "<strong>Izvori:</strong>";
    sources.forEach(src => {
      if (!src.url) return;
      const a = document.createElement("a");
      a.href = src.url;
      a.target = "_blank";
      a.textContent = src.title;
      s.appendChild(a);
    });
    if (s.children.length > 1) bubble.appendChild(s);
  }

  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return wrap;
}

function ask(q) {
  inputEl.value = q;
  send();
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;

  document.getElementById("suggestions").style.display = "none";
  addMessage(text, "user");
  inputEl.value = "";
  sendBtn.disabled = true;

  const placeholder = addMessage("Razmišljam...", "bot");
  placeholder.querySelector(".bubble").classList.add("typing");

  try {
    const res = await fetch(API + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session_id: sessionId })
    });

    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    sessionId = data.session_id;

    placeholder.remove();
    addMessage(data.answer, "bot", data.sources);
  } catch (e) {
    placeholder.remove();
    addMessage("Došlo je do greške. Pokušajte ponovno.", "bot");
    console.error(e);
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}
</script>
</body>
</html>
